
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Royal Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #18212b, #526779);
            display: grid;
            place-items: center;
            font-family: Arial;
        }

        .auth-card {
            width: min(440px, 92vw);
            background: #fff;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 18px 50px #0004;
        }

        .brand {
            color: #b38b45;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-gold {
            background: #b38b45;
            color: #fff;
            padding: 12px;
        }

        .btn-gold:hover {
            background: #987238;
            color: #fff;
        }
    </style>
</head>

<body>

    <main class="auth-card">

        <div class="text-center mb-4">
            <div class="brand">ROYAL HOTEL</div>
            <h2 class="mt-2">Welcome Back</h2>
            <p class="text-muted">Log in to manage your stay and bookings.</p>
        </div>

        <div id="message" class="alert d-none" role="alert"></div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input class="form-control" type="email" name="email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-gold w-100" type="submit">Login</button>

        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>

        <p class="text-center mt-3 mb-0">
            <a href="index.html" class="text-muted">Back to home</a>
        </p>

    </main>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async e => {
            e.preventDefault();

            const button = form.querySelector('button');
            button.disabled = true;
            button.textContent = 'Logging in...';
            message.className = 'alert d-none';

            try {
                const data = Object.fromEntries(new FormData(form));

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Login failed');
                }

                localStorage.setItem('royalHotelToken', result.token);
                localStorage.setItem('royalHotelUser', JSON.stringify(result.user));

                // Mark user as logged in
                localStorage.setItem('isLoggedIn', 'true');

                location.href = new URLSearchParams(location.search).get('next') || 'index.html';

            } catch (err) {
                message.textContent = err.message;
                message.className = 'alert alert-danger';
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });
    </script>

</body>
</html>
