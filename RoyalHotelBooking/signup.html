<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign Up - Royal Hotel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;background:linear-gradient(135deg,#18212b,#526779);display:grid;place-items:center;font-family:Arial}.auth-card{width:min(460px,92vw);background:#fff;border-radius:16px;padding:36px;box-shadow:0 18px 50px #0004}.brand{color:#b38b45;font-weight:700;letter-spacing:1px}.form-control{padding:12px}.btn-gold{background:#b38b45;color:#fff;padding:12px}.btn-gold:hover{background:#987238;color:#fff}</style></head><body><main class="auth-card"><div class="text-center mb-4"><div class="brand">ROYAL HOTEL</div><h2 class="mt-2">Create Account</h2><p class="text-muted">Sign up to book your perfect stay.</p></div><div id="message" class="alert d-none" role="alert"></div><form id="signupForm"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" type="text" name="name" autocomplete="name" required maxlength="80"></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="new-password" minlength="8" required><div class="form-text">Use at least 8 characters.</div></div><button class="btn btn-gold w-100" type="submit">Create Account</button></form><p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Login</a></p><p class="text-center mt-3 mb-0"><a href="index.html" class="text-muted">Back to home</a></p></main><script>
const form=document.getElementById('signupForm'),message=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;button.textContent='Creating account...';message.className='alert d-none';try{const data=Object.fromEntries(new FormData(form));const response=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Signup failed');localStorage.setItem('royalHotelToken',result.token);localStorage.setItem('royalHotelUser',JSON.stringify(result.user));location.href='booking.html';}catch(err){message.textContent=err.message;message.className='alert alert-danger';}finally{button.disabled=false;button.textContent='Create Account';}});
</script></body></html>
